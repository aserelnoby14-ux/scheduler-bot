name: Scheduler Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: scheduler-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot (loop mode)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          SUPPORT_URL: ${{ secrets.SUPPORT_URL }}
          DEV_URL: ${{ secrets.DEV_URL }}
          PUBLISH_INTERVAL_HOURS: '12'
          MAX_RUNTIME_SECONDS: '20700'
        run: python bot.py

      - name: Save state
  if: always()
  run: |
    git config user.name "github-actions[bot]"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    git add data/state.json
    if git diff --cached --quiet; then
      echo "no state change"
      exit 0
    fi
    git commit -m "chore: update state [skip ci]"
    for i in 1 2 3 4 5; do
      echo "push attempt $i"
      git pull --rebase -X theirs origin main
      if git push; then
        echo "state pushed successfully"
        exit 0
      fi
      sleep 10
    done
    echo "state push failed after 5 retries"
    exit 1